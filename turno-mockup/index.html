<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turno · Fasi</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* Layout: Turno app shell — dark sidebar, white header, grey work area; the Fasi page stacks the tournament map above the phase window. */
:root {
  --side: #131A2A; --side-hi: #1E2A4A; --side-ink: #C9D1E3; --side-dim: #7B869E;
  --blue: #2B63F1; --blue-ink: #1E4FD0; --blue-soft: #EAF0FE;
  --bg: #ECEFF0; --card: #FFFFFF; --aside: #F7F8FA; --line: #C4C9CF; --line-soft: #E3E6EA;
  --ink: #111827; --ink-2: #374151; --muted: #6B7280;
  --green: #059669; --green-bg: #ECFDF5; --green-ink: #047857;
  --warn: #B45309; --warn-bg: #FFFBEB; --bad: #B91C1C; --bad-bg: #FEF2F2;
  --gold: #C9A227; --silver: #9CA3AF; --bronze: #B7794A;
  --font: 'Manrope', 'Segoe UI', system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 500 14px/1.45 var(--font); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .5; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.cut { clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 0 100%); }
.bev { clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px)); }
.eb { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; }
.eb::before { content: ""; width: 3px; height: 14px; background: var(--blue); }
.tag { display: inline-block; transform: skewX(-10deg); font-size: 10px; font-weight: 800; letter-spacing: .5px; text-transform: uppercase; padding: 2px 7px; background: var(--line-soft); color: var(--ink-2); white-space: nowrap; }
.tag > span { display: inline-block; transform: skewX(10deg); }
.tag.blue { background: var(--blue); color: #fff; } .tag.green { background: var(--green-bg); color: var(--green-ink); }
.tag.warn { background: var(--warn-bg); color: var(--warn); } .tag.bad { background: var(--bad-bg); color: var(--bad); }
.tag.dark { background: var(--side); color: #fff; } .tag.ghost { background: transparent; border: 1px solid var(--line); }
.muted { color: var(--muted); } .small { font-size: 12px; } .b { font-weight: 800; }

/* app shell */
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--side); color: var(--side-ink); display: flex; flex-direction: column; padding-block: 22px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.logo { padding: 0 22px; font-size: 24px; font-weight: 800; color: var(--blue); letter-spacing: -.5px; }
.logo small { display: block; font-size: 10px; letter-spacing: 2px; color: var(--side-dim); font-weight: 700; margin-top: 2px; }
.side-active { margin: 22px 22px 10px; font-size: 10px; letter-spacing: 2px; font-weight: 800; color: #7EA2FF; }
.side-t { margin: 0 22px 18px; font-size: 13px; font-weight: 700; color: #fff; }
.nav { display: flex; flex-direction: column; }
.nav button { text-align: left; background: none; border: 0; border-left: 4px solid transparent; padding: 11px 18px; color: var(--side-ink); font-size: 12px; font-weight: 800; letter-spacing: 1.4px; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.nav button:hover:not(:disabled) { background: rgba(255,255,255,.04); color: #fff; }
.nav button.on { background: var(--side-hi); border-left-color: var(--blue); color: #fff; }
.nav .cnt { font-size: 10px; color: var(--side-dim); letter-spacing: 0; font-weight: 700; }
.nav-sep { margin: 16px 22px 6px; font-size: 10px; letter-spacing: 2px; color: var(--side-dim); font-weight: 800; }
.side-foot { margin-top: auto; padding: 16px 22px 0; font-size: 11px; color: var(--side-dim); line-height: 1.5; }
.side-foot button { background: none; border: 1px solid #2A3550; color: var(--side-ink); padding: 6px 10px; font-size: 11px; font-weight: 700; margin-top: 8px; width: 100%; }

.top { background: var(--card); border-bottom: 1px solid var(--line-soft); display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding-block: 14px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); }
.top .t-name { font-size: 16px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; min-width: 0; overflow-wrap: anywhere; }
.sport-pill { border-left: 4px solid var(--blue); background: var(--aside); padding: 4px 10px; font-size: 11px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; }
.sport-pill b { color: var(--blue); }
.top .grow { flex: 1; }
.main { padding-block: 26px 60px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); min-width: 0; }
.h1 { display: flex; align-items: center; gap: 12px; margin: 0 0 6px; font-size: 26px; font-weight: 800; letter-spacing: -.3px; text-wrap: balance; }
.h1::before { content: ""; width: 4px; height: 26px; background: var(--blue); flex: none; }
.lead { margin: 0 0 22px; color: var(--muted); max-width: 72ch; }

/* buttons */
.btn { border: 1px solid var(--line); background: var(--card); padding: 8px 14px; font-weight: 800; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover:not(:disabled) { border-color: var(--ink-2); }
.btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn.primary:hover:not(:disabled) { background: var(--blue-ink); }
.btn.dark { background: var(--side); color: #fff; border-color: var(--side); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--blue-ink); padding-inline: 8px; }
.btn.ghost:hover:not(:disabled) { background: var(--blue-soft); border-color: transparent; }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 5px 10px; font-size: 12px; }
.icon-btn { border: 1px solid var(--line-soft); background: var(--card); width: 28px; height: 28px; display: inline-grid; place-items: center; font-size: 14px; padding: 0; line-height: 1; }
.icon-btn:hover:not(:disabled) { border-color: var(--ink-2); }

/* surfaces */
.card { background: var(--card); padding: 22px 24px; }
.card + .card, .stack > * + * { margin-top: 18px; }
.card-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.card-h h2 { margin: 4px 0 0; font-size: 18px; font-weight: 800; }
.card-h p { margin: 4px 0 0; color: var(--muted); font-size: 13px; max-width: 70ch; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row.tight { gap: 4px; flex-wrap: nowrap; }
.spacer { flex: 1; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px 18px; }
.grid4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px 16px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field-label { font-size: 11px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); }
.hint { font-size: 12px; color: var(--muted); }
input, select, textarea { border: 1px solid var(--line); background: var(--card); padding: 8px 10px; min-width: 0; max-width: 100%; }
input:focus, select:focus, textarea:focus { border-color: var(--blue); outline: none; box-shadow: 0 0 0 2px var(--blue-soft); }
textarea { width: 100%; resize: vertical; }
input[type="checkbox"] { accent-color: var(--blue); width: 16px; height: 16px; }
input.num { width: 72px; }
.check { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
.checks { display: flex; flex-wrap: wrap; gap: 8px 16px; }
.note { border-left: 4px solid var(--line); background: var(--aside); padding: 10px 14px; font-size: 13px; }
.note.good { border-color: var(--green); background: var(--green-bg); color: var(--green-ink); }
.note.warn { border-color: #F59E0B; background: var(--warn-bg); color: #7C3E06; }
.note.bad { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }
.note ul { margin: 4px 0 0; padding-left: 18px; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); background: var(--card); }
.seg button { border: 0; background: none; padding: 7px 14px; font-weight: 700; font-size: 13px; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--line-soft); }
.seg button.on { background: var(--side); color: #fff; }
details.disc > summary { cursor: pointer; font-weight: 700; font-size: 13px; color: var(--blue-ink); padding: 6px 0; }
.tbl-wrap { overflow-x: auto; }
table.tbl { border-collapse: collapse; width: 100%; font-size: 13px; }
.tbl th { text-align: left; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); font-weight: 800; padding: 8px 10px; border-bottom: 2px solid var(--line-soft); white-space: nowrap; }
.tbl td { padding: 7px 10px; border-bottom: 1px solid var(--line-soft); }
.tbl .n { text-align: right; font-variant-numeric: tabular-nums; }
.tbl tr.adv td { background: var(--green-bg); }
.tbl tr.adv td:first-child { box-shadow: inset 4px 0 0 var(--green); }
.tie { color: var(--warn); font-weight: 800; margin-left: 2px; }
.cat-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
.cat-chips button { border: 1px solid var(--line); background: var(--card); padding: 6px 14px; font-weight: 800; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; }
.cat-chips button.on { background: var(--side); border-color: var(--side); color: #fff; }

/* ---------- tournament map (W9 / W10) ---------- */
.map-card { background: var(--card); padding: 20px 24px 22px; }
.map-wrap { display: flex; gap: 0; margin-top: 16px; align-items: stretch; }
.map-scroll { flex: 1; min-width: 0; overflow-x: auto; overflow-y: hidden; padding: 4px 2px 6px; }
.map { position: relative; }
.map svg { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
.chip { position: absolute; text-align: left; border: 1px solid var(--line-soft); border-left: 4px solid var(--line); background: var(--card); padding: 10px 14px; display: flex; flex-direction: column; justify-content: center; gap: 3px; transition: border-color .15s, box-shadow .15s; }
.chip:hover:not(:disabled) { border-color: var(--line); box-shadow: 0 2px 10px rgba(17, 24, 39, .06); }
.chip.ok { border-left-color: var(--green); }
.chip.err { border-left-color: var(--bad); }
.chip .c-top { white-space: nowrap; display: flex; align-items: center; gap: 7px; font-size: 10px; font-weight: 800; letter-spacing: 1.3px; text-transform: uppercase; color: var(--ink-2); min-width: 0; }
.chip .c-top b { overflow: hidden; text-overflow: ellipsis; }
.chip .c-name { font-size: 14px; font-weight: 800; text-transform: uppercase; letter-spacing: .3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip .c-sum { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip .c-st { margin-left: auto; white-space: nowrap; font-size: 10px; font-weight: 800; letter-spacing: 1px; color: var(--muted); }
.chip .c-st.ok { color: var(--green-ink); } .chip .c-st.warn { color: var(--warn); } .chip .c-st.bad { color: var(--bad); }
.chip.on { background: var(--blue); border-color: var(--blue); border-left-color: var(--blue); color: #fff; }
.chip.on .c-top, .chip.on .c-sum, .chip.on .c-st { color: rgba(255,255,255,.88); }
.chip.on .tag { background: rgba(255,255,255,.2); color: #fff; }
.sq { display: inline-block; width: 10px; height: 10px; flex: none; }
.sq.lg { width: 14px; height: 14px; }
.ghost-wrap { position: absolute; display: flex; align-items: center; gap: 12px; white-space: nowrap; }
.chip.ghost { position: static; width: auto; min-width: 160px; border: 1.5px dashed var(--line); border-left: 1.5px dashed var(--line); background: transparent; color: var(--blue-ink); align-items: center; font-weight: 800; font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; padding: 0 16px; }
.chip.ghost:hover:not(:disabled), .chip.ghost.on { border-color: var(--blue); background: var(--blue-soft); box-shadow: none; }
.chip.ghost:disabled { color: var(--muted); }
.ghost-note { font-size: 12px; color: var(--ink-2); font-weight: 600; }
.conn-pill { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 2px; pointer-events: none; margin-top: 8px; }
.conn-pill b { background: var(--green-bg); color: var(--green); border: 1px solid var(--green); font-size: 11px; font-weight: 800; padding: 1px 8px; white-space: nowrap; }
.conn-pill span { font-size: 9px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; color: var(--green-ink); white-space: nowrap; }
.conn-pill.bad b { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }
.conn-pill.bad span { color: var(--bad); }
.map-riep { flex: none; width: 220px; border: 0; border-left: 1px solid var(--line-soft); background: none; margin-left: 16px; padding: 6px 0 6px 20px; text-align: left; display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: var(--ink); align-self: flex-start; }
.map-riep:hover:not(:disabled), .map-riep.on { background: var(--aside); }
.warn-t { color: var(--warn); font-weight: 800; } .ok-t { color: var(--green-ink); font-weight: 800; }

/* ---------- phase window ---------- */
.win { margin-top: 18px; background: var(--card); }
.win-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; padding: 20px 24px 0; border-bottom: 1px solid var(--line-soft); }
.win-top > .stack { padding-bottom: 14px; }
.win-title { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.3px; }
.win-tabs { display: flex; align-items: flex-end; gap: 2px; flex-wrap: wrap; }
.win-tabs button { border: 0; background: none; padding: 10px 14px 9px; font-size: 13px; border-bottom: 3px solid transparent; white-space: nowrap; display: inline-flex; align-items: center; gap: 7px; color: var(--ink); }
.win-tabs button .muted { font-weight: 600; font-size: 12px; }
.win-tabs .tab-add { color: var(--blue-ink); font-weight: 800; }
.win-tabs .tab-del { color: var(--bad); font-weight: 700; font-size: 12px; }
.win-body { display: grid; grid-template-columns: 320px minmax(0, 1fr); }
.win-aside { background: var(--aside); padding: 20px 22px; margin: 20px 0 20px 24px; display: flex; flex-direction: column; gap: 18px; min-width: 0; align-self: start; }
.win-main { padding: 20px 24px 24px; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.win-foot { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; border-top: 1px solid var(--line-soft); padding: 14px 24px; background: var(--card); }
.win-foot .btn { height: 42px; text-transform: uppercase; letter-spacing: .8px; font-size: 11px; }
.foot-msg { font-size: 12.5px; font-weight: 700; color: var(--ink-2); }
.foot-msg.warn { color: var(--warn); }
.info { margin: 0; font-size: 12.5px; color: var(--ink-2); line-height: 1.5; border-left: 3px solid var(--blue); padding-left: 10px; }
.stepper { display: flex; }
.stp { width: 38px; height: 42px; border: 1px solid var(--line); background: var(--card); font-size: 18px; font-weight: 700; }
.stp-v { min-width: 54px; height: 42px; border: 1px solid var(--line); border-left: 0; border-right: 0; display: grid; place-items: center; font-size: 16px; font-weight: 800; background: var(--card); padding: 0 8px; }
.stepper .stp-v:only-child { border: 1px solid var(--line); }
.count-box { border: 1px solid var(--green); background: var(--green-bg); color: var(--green-ink); padding: 12px 16px; display: flex; flex-direction: column; gap: 2px; }
.count-box b { font-size: 26px; font-weight: 800; }
.count-box b small { font-size: 15px; }
.seg.full { display: flex; width: 100%; }
.seg.full button { flex: 1; padding: 7px 6px; font-size: 12px; }
.seg button.cross.on { background: #6D28D9; }
.plist { display: flex; flex-direction: column; gap: 4px; }
.prow { display: flex; justify-content: space-between; align-items: center; gap: 8px; border: 1px solid var(--line-soft); background: var(--card); padding: 8px 12px; font-size: 13px; font-weight: 700; text-align: left; width: 100%; }
.prow .pst { font-size: 10px; font-weight: 800; letter-spacing: .8px; text-transform: uppercase; white-space: nowrap; }
.prow.mine .pst { color: var(--green-ink); }
.prow.free { color: var(--muted); font-weight: 600; }
.prow.free:hover { border-color: var(--blue); color: var(--ink); }
.prow.mine:hover { border-color: var(--bad); }
.prow.other { color: var(--muted); font-weight: 600; opacity: 1; }
.prow.other .pst { background: var(--line-soft); padding: 1px 6px; color: var(--ink-2); }
.prow.cross.mine span:first-child { color: #5B21B6; }
.rounds { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.rounds button { height: 40px; border: 1px solid #9CA3AF; background: var(--card); font-weight: 700; font-size: 12.5px; }
.rounds button.on { background: var(--blue); border-color: var(--blue); color: #fff; }
.rounds button:disabled { border-color: var(--line-soft); color: var(--muted); }
.tb-list.compact li { padding: 5px 8px; gap: 8px; }
.tb-list.compact .nm { min-width: 0; font-size: 13px; }

/* add phase (W2) */
.add-body { padding: 26px 28px; display: flex; flex-direction: column; gap: 20px; }
.add-h { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -.4px; text-wrap: balance; }
.pchips { display: flex; flex-wrap: wrap; gap: 8px; }
.pchip { padding: 7px 12px; background: var(--green-bg); border: 1px solid #A7F3D0; color: #065F46; font-size: 12.5px; font-weight: 700; }
.pchip.used { background: var(--aside); border-color: var(--line-soft); color: var(--muted); }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
.opt { border: 1px solid var(--line); background: var(--card); padding: 22px 24px; display: flex; flex-direction: column; gap: 12px; text-align: left; }
.opt.on { border: 2px solid var(--blue); background: #F8FAFF; }
.opt-h { display: flex; align-items: center; gap: 12px; }
.opt-i { width: 42px; height: 42px; display: grid; place-items: center; background: var(--blue-soft); color: var(--blue); font-size: 20px; }
.opt.on .opt-i { background: var(--blue); color: #fff; }
.opt-t { font-size: 19px; font-weight: 800; flex: 1; }
.opt .li { display: flex; gap: 10px; font-size: 13.5px; color: var(--ink-2); line-height: 1.5; }
.opt .ck { color: var(--green); font-weight: 800; }
.opt-f { margin-top: 4px; font-size: 11px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--blue-ink); }
.clickrow { cursor: pointer; } .clickrow:hover td { background: var(--aside); }

/* slots + menus (W5 / W10) */
.pools.wide { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.pool.over { outline: 2px dashed var(--blue); outline-offset: 2px; }
.pool-h.light { background: var(--aside); color: var(--ink); border-bottom: 1px solid var(--line-soft); }
.slots { padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.slot-wrap { position: relative; }
.slot-btn { width: 100%; min-height: 38px; border: 1px solid var(--line-soft); background: var(--card); display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 10px; font-size: 13px; font-weight: 600; text-align: left; }
.slot-btn small { color: var(--muted); font-weight: 600; font-size: 11px; }
.slot-btn .chev { color: var(--muted); font-size: 11px; }
.slot-btn:hover, .slot-btn.open { border-color: var(--blue); }
.slot-btn.cross { background: #F5F3FF; color: #5B21B6; }
.slot-btn.ro { cursor: default; }
.slot-btn.add { border-style: dashed; color: var(--blue-ink); font-weight: 800; justify-content: center; }
.slot-menu { position: absolute; z-index: 20; top: calc(100% + 4px); left: 0; width: 300px; max-height: 360px; overflow: auto; background: var(--card); border: 1px solid var(--line); box-shadow: 0 10px 28px rgba(17, 24, 39, .16); padding: 6px 0; }
.slot-menu .m-h { font-size: 10px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); padding: 8px 12px 4px; }
.slot-menu .m-h.cross { color: #6D28D9; }
.slot-menu button { display: flex; justify-content: space-between; gap: 10px; width: 100%; border: 0; background: none; padding: 7px 12px; font-size: 13px; text-align: left; }
.slot-menu button small { color: var(--muted); font-size: 11px; white-space: nowrap; }
.slot-menu button:hover:not(:disabled) { background: var(--blue-soft); }
.slot-menu button.cur { background: #F5F3FF; font-weight: 800; }
.slot-menu button:disabled { opacity: .55; }
.slot-menu .m-sep { border-top: 1px solid var(--line-soft); margin: 6px 0; }
.slot-menu .rm { color: var(--bad); font-weight: 700; }
.drag { cursor: grab; }
.drag.dragging { opacity: .4; }
.drag.over { outline: 2px dashed var(--blue); }
.handle { color: var(--muted); font-size: 12px; }
.pool li .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini-sel { padding: 1px 2px; font-size: 11px; border-color: var(--line-soft); color: var(--muted); }
.rules3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; font-size: 12.5px; color: var(--ink-2); }
.rules3 > div { background: var(--aside); padding: 10px 12px; }

/* knockout board */
.ko-h { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--line-soft); padding-bottom: 12px; }
.ko-h .name { font-size: 18px; font-weight: 800; border: 1px solid transparent; padding: 3px 4px; width: 130px; }
.ko-h .name:hover, .ko-h .name:focus { border-color: var(--line); }
.switch { display: inline-flex; align-items: center; gap: 10px; font-weight: 800; font-size: 13px; cursor: pointer; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch i { width: 44px; height: 24px; border: 2px solid var(--line); background: var(--card); position: relative; }
.switch i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; background: var(--line); transition: left .15s; }
.switch input:checked + i { background: var(--blue); border-color: var(--blue); }
.switch input:checked + i::after { left: 22px; background: #fff; }
.switch input:focus-visible + i { outline: 2px solid var(--blue); outline-offset: 2px; }
.more { position: relative; font-size: 13px; }
.more summary { cursor: pointer; font-weight: 700; color: var(--blue-ink); }
.more-pop { position: absolute; right: 0; top: calc(100% + 6px); z-index: 10; background: var(--card); border: 1px solid var(--line); padding: 12px; width: 240px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 8px 20px rgba(17,24,39,.12); }
.ko { display: flex; gap: 26px; overflow-x: auto; padding-bottom: 10px; }
.ko-col { display: flex; flex-direction: column; min-width: 236px; flex: 1 0 236px; }
.ko .colh { font-size: 12px; font-weight: 800; letter-spacing: 1.4px; text-transform: uppercase; color: var(--ink-2); padding-bottom: 10px; border-bottom: 2px solid var(--ink); margin-bottom: 16px; }
.ko .lane { display: flex; flex-direction: column; justify-content: space-around; gap: 16px; flex: 1; }
.m { border: 1px solid var(--line); background: var(--card); width: 100%; max-width: 270px; display: block; padding: 0; text-align: left; }
.m.gold { border-color: #D97706; } .m.blue { border: 2px solid var(--blue); }
.m.click { cursor: pointer; } .m.click:hover { box-shadow: 0 0 0 2px var(--blue-soft); border-color: var(--blue); }
.m.dim { opacity: .45; }
.ml { font-size: 10px; font-weight: 800; letter-spacing: 1px; color: var(--muted); padding: 6px 10px 4px; display: flex; justify-content: space-between; gap: 8px; text-transform: uppercase; }
.ml small { font-weight: 600; color: #9CA3AF; letter-spacing: 0; }
.m.gold .ml span:first-child { color: #9A3412; }
.m .s { height: 38px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 10px; font-size: 13px; font-weight: 600; border-top: 1px solid var(--line-soft); }
.m .slot-wrap { border-top: 1px solid var(--line-soft); }
.m .slot-btn { border: 0; height: 38px; }
.m .slot-btn:hover, .m .slot-btn.open { box-shadow: inset 0 0 0 1px var(--blue); }
.m .s .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.m .s.tbd { color: var(--muted); font-weight: 500; }
.m .s.cross { background: #F5F3FF; color: #5B21B6; }
.m .s.w { background: var(--green-bg); color: var(--green-ink); font-weight: 800; }
.m .s .sc { font-variant-numeric: tabular-nums; font-weight: 800; }
.s.bye { background: repeating-linear-gradient(135deg, #F3F4F6 0 6px, #E9EBEE 6px 12px); color: var(--ink-2); font-weight: 800; letter-spacing: 1.4px; font-size: 11px; }
.sub-t { font-size: 12px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; color: var(--ink-2); margin: 0 0 8px; }
.sel-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.sel-list li { border-left: 4px solid var(--green); background: var(--green-bg); padding: 7px 12px; font-size: 13px; }
.pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.pick-col-h { font-size: 11px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.pick { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line-soft); padding: 7px 10px; margin-bottom: 4px; font-size: 13px; font-weight: 700; cursor: pointer; }
.pick.on { border-color: var(--blue); background: var(--blue-soft); }
.pick.taken { opacity: .55; }
.pick .who { font-weight: 500; color: var(--muted); font-size: 12px; margin-left: auto; text-align: right; }
.pick .in { margin-left: auto; font-size: 10px; font-weight: 800; color: var(--warn); text-transform: uppercase; }
.out-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.out-box { border: 1px solid var(--line-soft); border-top: 3px solid var(--blue); padding: 12px 14px; }
.out-box b { display: block; font-size: 14px; }
.out-box p { margin: 4px 0 0; font-size: 12px; color: var(--muted); }
.out-box ul { margin: 8px 0 0; padding-left: 16px; font-size: 12px; }

/* pools */
.pools { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.pool { border: 1px solid var(--line-soft); }
.pool-h { background: var(--side); color: #fff; padding: 7px 12px; font-size: 12px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; display: flex; justify-content: space-between; }
.pool ul { list-style: none; margin: 0; padding: 6px; display: flex; flex-direction: column; gap: 4px; }
.pool li { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 4px 6px; background: var(--aside); }
.pool li span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pool li select { padding: 2px 4px; font-size: 12px; }

/* bracket */
.bracket-sec + .bracket-sec { margin-top: 18px; }
.bracket { display: flex; gap: 26px; overflow-x: auto; padding-bottom: 8px; }
.b-col { display: flex; flex-direction: column; justify-content: space-around; gap: 14px; min-width: 210px; }
.b-col-h { font-size: 11px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); border-bottom: 2px solid var(--line-soft); padding-bottom: 4px; }
.game { width: 210px; border: 1px solid var(--line); background: var(--card); padding: 0; text-align: left; display: block; }
.game.click:hover { border-color: var(--blue); box-shadow: 0 0 0 2px var(--blue-soft); }
.game:disabled { opacity: 1; cursor: default; }
.game.dim { opacity: .45; }
.g-top { display: flex; justify-content: space-between; align-items: center; padding: 3px 8px; font-size: 10px; font-weight: 800; color: var(--muted); background: var(--aside); letter-spacing: .5px; }
.g-side { display: flex; justify-content: space-between; align-items: center; height: 36px; padding: 0 10px; font-size: 13px; font-weight: 700; border-top: 1px solid var(--line-soft); gap: 8px; }
.g-side .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.g-side .nm.ph { color: var(--muted); font-weight: 600; font-style: italic; }
.g-side.w { background: var(--green-bg); }
.g-side.w .nm { color: var(--green-ink); }
.g-side .sc { font-variant-numeric: tabular-nums; font-weight: 800; }
.game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.game-grid .game { width: 100%; }

/* misc */
.modal-back { position: fixed; inset: 0; background: rgba(19, 26, 42, .55); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal { background: var(--card); width: min(560px, 100%); max-height: calc(100% - 32px); overflow: auto; }
.modal-h { display: flex; justify-content: space-between; align-items: center; padding: 18px 22px 0; gap: 12px; }
.modal-h h3 { margin: 0; font-size: 17px; font-weight: 800; }
.modal-b { padding: 16px 22px; display: flex; flex-direction: column; gap: 14px; }
.modal-f { padding: 14px 22px 18px; display: flex; gap: 8px; justify-content: flex-end; border-top: 1px solid var(--line-soft); flex-wrap: wrap; }
.sets th, .sets td { padding: 4px; font-size: 13px; text-align: left; }
.sets input { width: 58px; }
.toast { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--side); color: #fff; padding: 10px 18px; font-weight: 700; z-index: 60; max-width: calc(100% - 32px); border-left: 4px solid var(--blue); }
.toast.good { border-left-color: var(--green); } .toast.warn { border-left-color: #F59E0B; } .toast.bad { border-left-color: #EF4444; }
.list-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 0; border-bottom: 1px solid var(--line-soft); }
.tb-list { list-style: none; padding: 0; margin: 0 0 12px; display: flex; flex-direction: column; gap: 6px; }
.tb-list li { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line-soft); padding: 7px 10px; flex-wrap: wrap; }
.tb-list .rk { width: 24px; height: 24px; display: grid; place-items: center; background: var(--side); color: #fff; font-size: 12px; font-weight: 800; }
.tb-list .nm { flex: 1; font-weight: 700; min-width: 140px; }
.tb-list .nm small { display: block; color: var(--muted); font-weight: 500; }
.courts { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-top: 12px; }
.court { border: 1px solid var(--line-soft); border-top: 3px solid var(--line); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.court.busy { border-top-color: var(--blue); }
.queue { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px; }
.queue li { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line-soft); padding: 6px 10px; flex-wrap: wrap; }
.queue .q { flex: 1; min-width: 180px; display: flex; flex-direction: column; }
.ties { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.tie-box { border: 1px solid #FCD34D; background: var(--warn-bg); padding: 10px 12px; }
.tie-box.ok { border-color: #A7F3D0; background: var(--green-bg); }
.tie-box ol { padding-left: 18px; margin: 8px 0; }
.tie-box li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 2px 0; }
.confirm { border-top: 1px solid var(--line-soft); margin-top: 18px; padding-top: 16px; display: flex; flex-direction: column; gap: 12px; }
.resolved { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 4px 16px; font-size: 13px; }
pre.json { background: var(--side); color: #D6DEF0; padding: 14px; font-size: 12px; overflow: auto; max-height: 420px; margin: 0; }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px 18px; margin: 0; }
.kv div { border-left: 3px solid var(--line-soft); padding-left: 10px; }
.kv dt { font-size: 11px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
.kv dd { margin: 2px 0 0; font-weight: 700; }
.empty-hero { background: var(--card); padding: 34px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }

@media (max-width: 960px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; height: auto; padding-block: 14px 8px; }
  .nav { flex-direction: row; overflow-x: auto; }
  .nav button { border-left: 0; border-bottom: 3px solid transparent; white-space: nowrap; }
  .nav button.on { border-bottom-color: var(--blue); }
  .nav-sep, .side-foot, .side-t, .side-active { display: none; }
  .win-body { grid-template-columns: minmax(0, 1fr); }
  .win-aside { margin: 16px 16px 0; }
  .map-wrap { flex-direction: column; }
  .map-riep { width: auto; border-left: 0; border-top: 1px solid var(--line-soft); margin: 12px 0 0; padding: 12px 0 0; }
  .main, .top { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}
.pool li .handle { flex: none; }
/* drag & drop dei posti */
.slot-btn.empty { border-style: dashed; color: var(--muted); font-weight: 600; background: var(--aside); }
.m .slot-btn.bye { background: repeating-linear-gradient(135deg, #F3F4F6 0 6px, #E9EBEE 6px 12px); color: var(--ink-2); font-weight: 800; letter-spacing: 1.4px; font-size: 11px; }
.slot-btn.dragging { opacity: .4; }
.slot-btn[draggable="true"] { cursor: grab; }
.slot-wrap.over > .slot-btn { box-shadow: inset 0 0 0 2px var(--blue); background: var(--blue-soft); }
.plist-wrap.over { outline: 2px dashed var(--blue); outline-offset: 6px; }
.prow[draggable="true"] { cursor: grab; }
.prow .handle { color: #9CA3AF; }
.drop-here { border: 1.5px dashed var(--line); background: transparent !important; color: var(--muted); font-size: 11.5px !important; font-weight: 600 !important; justify-content: center; }
.pool.over .drop-here { border-color: var(--blue); color: var(--blue-ink); }
.pool-size { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 800; letter-spacing: .5px; }
.stp.xs { width: 22px; height: 22px; font-size: 13px; line-height: 1; padding: 0; }

.slot-btn, .prow { cursor: pointer; }
.prow.dis { cursor: default; }
.slot-btn:focus-visible, .prow:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }

.srcchip { padding: 7px 12px; border: 1px solid var(--line); background: var(--card); font-size: 12.5px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }
.srcchip.on { border-color: var(--blue); background: var(--blue-soft); color: var(--blue-ink); }
.pchip.idle { background: var(--card); border-color: var(--line-soft); color: var(--ink-2); }

/* riepilogo sotto la mappa: la mappa usa tutta la larghezza */
.map-wrap { flex-direction: column; }
.map-riep { width: auto; flex-direction: row; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; border-left: 0; border-top: 1px solid var(--line-soft); margin: 8px 0 0; padding: 12px 10px; align-self: stretch; }
</style>

<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
/* Tournament engine – pure logic, no DOM.
   Model: a category is a graph of phases (black boxes) linked by connectors.
   See docs/PHASE-DESIGN.md and docs/SPEC.md. Exposed as window.TE (browser) or module.exports (node). */
(function (root) {
  'use strict';

  // ---------- utils ----------
  let idCounter = 0;
  const uid = (p) => `${p || 'id'}_${Date.now().toString(36)}_${(idCounter++).toString(36)}`;
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const ordinal = (n) => { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };
  const letter = (i) => String.fromCharCode(65 + i);
  const nextPow2 = (n) => { let p = 1; while (p < n) p *= 2; return p; };
  function rng(seed) { let s = seed >>> 0 || 1; return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return ((s >>> 0) % 1e9) / 1e9; }; }
  // "1-4, 7" -> [1,2,3,4,7]
  function parsePositions(text) {
    const out = [];
    String(text || '').split(',').map((s) => s.trim()).filter(Boolean).forEach((part) => {
      const m = part.match(/^(\d+)\s*-\s*(\d+)$/);
      if (m) { for (let i = +m[1]; i <= +m[2]; i++) out.push(i); } else if (/^\d+$/.test(part)) out.push(+part);
    });
    return [...new Set(out)].filter((n) => n > 0).sort((a, b) => a - b);
  }
  function formatPositions(list) {
    const out = []; let i = 0;
    while (i < list.length) { let j = i; while (j + 1 < list.length && list[j + 1] === list[j] + 1) j++; out.push(j > i ? `${list[i]}-${list[j]}` : `${list[i]}`); i = j + 1; }
    return out.join(', ');
  }

  // ---------- sports (SPEC §3) ----------
  const SPORTS = {
    FOOTBALL: { label: 'Football', space: ['field', 'fields'], ties: true, sets: false, unit: ['goal', 'goals'], points: { win: 3, tie: 1, loss: 0 }, forfeit: { home: 3, away: 0 }, rest: 30, gameLength: 40, players: false, americano: false, scheduling: 'FIXED' },
    FUTSAL: { label: 'Futsal', space: ['court', 'courts'], ties: true, sets: false, unit: ['goal', 'goals'], points: { win: 3, tie: 1, loss: 0 }, forfeit: { home: 3, away: 0 }, rest: 15, gameLength: 30, players: false, americano: false, scheduling: 'FIXED' },
    VOLLEYBALL: { label: 'Volleyball', space: ['court', 'courts'], ties: false, sets: true, bestOf: 3, unit: ['point', 'points'], points: { win: 2, tie: 0, loss: 0 }, forfeitSet: [25, 0], rest: 15, gameLength: 60, players: false, americano: false, scheduling: 'FIXED' },
    TENNIS: { label: 'Tennis', space: ['court', 'courts'], ties: false, sets: true, bestOf: 3, unit: ['game', 'games'], points: { win: 1, tie: 0, loss: 0 }, forfeitSet: [6, 0], rest: 15, gameLength: 90, players: true, americano: true, scheduling: 'FIXED' },
    PADEL: { label: 'Padel', space: ['court', 'courts'], ties: false, sets: true, bestOf: 3, unit: ['game', 'games'], points: { win: 1, tie: 0, loss: 0 }, forfeitSet: [6, 0], rest: 15, gameLength: 60, players: true, americano: true, scheduling: 'QUEUE' },
  };

  // ---------- phase types (PHASE-DESIGN §5) ----------
  const PHASE_TYPES = {
    GROUPS: { label: 'Groups', kind: 'TEAM', desc: 'Teams play the others in their group. Rankings: each group, overall, best k-th placed.' },
    KNOCKOUT: { label: 'Knockout', kind: 'TEAM', desc: 'Teams are out after one loss, or after two with a lower bracket. Ranking: final placings.' },
    AMERICANO: { label: 'Americano', kind: 'PLAYER', desc: 'Players rotate partners every round. Ranking: players by points won.' },
  };
  const DISTRIBUTIONS = { SNAKE: 'Snake by seed', SEQUENTIAL: 'In seed order', MANUAL: 'Manual', AVOID_REMATCH: 'Avoid rematches' };
  const DYNAMIC = new Set(['AVOID_REMATCH']);
  function defaultPhaseConfig(type) {
    switch (type) {
      case 'GROUPS': return { pools: 2, distribution: 'SNAKE', games: 'ALL_ONCE', gamesPerTeam: 3, crossovers: [], gameLength: null, manualPools: null };
      // eliminations: 1 = single elimination, 2 = double elimination (upper + lower bracket)
      case 'KNOCKOUT': return { eliminations: 1, placements: [1], consolations: [], bracketReset: true, gameLength: null };
      case 'AMERICANO': return { gameLength: null };
      default: return {};
    }
  }

  // Presets: ready-made phase graphs (SPEC §4)
  const TEMPLATES = [
    { id: 'RR_SE', name: 'Groups to Knockout', recommended: true, desc: 'Group stage, then a knockout. Add flights for more brackets.', flow: ['GROUPS', 'KNOCKOUT'] },
    { id: 'RR_DE', name: 'Groups to Double Knockout', desc: 'Group stage, then a knockout where teams are out after two losses.', flow: ['GROUPS', 'KNOCKOUT'] },
    { id: 'RR', name: 'Groups', desc: 'One group stage, ranked by results.', flow: ['GROUPS'] },
    { id: 'SE', name: 'Knockout', desc: 'A single knockout bracket.', flow: ['KNOCKOUT'] },
    { id: 'DE', name: 'Double Knockout', desc: 'A knockout where teams are out after two losses.', flow: ['KNOCKOUT'] },
    { id: 'RR3', name: 'Groups × 3, reshuffled', desc: 'Three group stages; each reshuffles the groups avoiding rematches and carries points over. Then a knockout.', flow: ['GROUPS', 'GROUPS', 'GROUPS', 'KNOCKOUT'] },
    { id: 'AM', name: 'Americano', americano: true, desc: 'Players rotate partners every round.', flow: ['AMERICANO'] },
    { id: 'AM_SE', name: 'Americano to Knockout', americano: true, desc: 'Americano, then the top players form pairs (1st + last qualifier…) for a knockout.', flow: ['AMERICANO', 'KNOCKOUT'] },
  ];
  const templatesFor = (sport) => TEMPLATES.filter((t) => !t.americano || SPORTS[sport].americano);

  // ---------- tiebreakers (SPEC §5.4) ----------
  const RULES = {
    POINTS: { name: 'Points', eq: 'PTS', v: (s) => s.PTS, avg: true },
    WINS: { name: 'Wins', eq: 'W', v: (s) => s.W, avg: true },
    MATCHUPS: { name: 'Matchups', eq: '2×W + T', v: (s) => 2 * s.W + s.T, avg: true },
    SCORE_DIFF: { name: 'Score difference', eq: 'For − Against', v: (s) => s.PF - s.PA, avg: true },
    SCORE_FOR: { name: 'Most scored', eq: 'For', v: (s) => s.PF, avg: true },
    SCORE_AGAINST_LEAST: { name: 'Least conceded', eq: 'Against (lowest)', v: (s) => -s.PA, avg: true },
    SCORE_RATIO: { name: 'Score ratio', eq: 'For ÷ Against', v: (s) => (s.PA ? s.PF / s.PA : s.PF ? Infinity : 0) },
    SET_DIFF: { name: 'Set difference', eq: 'Sets won − lost', v: (s) => s.SF - s.SA, avg: true, sets: true },
    SET_RATIO: { name: 'Set ratio', eq: 'Sets won ÷ lost', v: (s) => (s.SA ? s.SF / s.SA : s.SF ? Infinity : 0), sets: true },
    SETS_FOR: { name: 'Most sets won', eq: 'Sets won', v: (s) => s.SF, avg: true, sets: true },
    SETS_AGAINST_LEAST: { name: 'Fewest sets lost', eq: 'Sets lost (lowest)', v: (s) => -s.SA, avg: true, sets: true },
  };
  const rulesFor = (sport) => Object.keys(RULES).filter((k) => !RULES[k].sets || SPORTS[sport].sets);
  const DEFAULT_TIEBREAKERS = {
    FOOTBALL: [['POINTS', 'O'], ['POINTS', 'H'], ['SCORE_DIFF', 'H'], ['SCORE_DIFF', 'O'], ['SCORE_FOR', 'O']],
    FUTSAL: [['POINTS', 'O'], ['POINTS', 'H'], ['SCORE_DIFF', 'H'], ['SCORE_DIFF', 'O'], ['SCORE_FOR', 'O']],

  // category-level rules shared by all its phases

  // ---------- state ----------

  }
  const findCat = (st, id) => st.categories.find((c) => c.id === id);

  // ---------- seeding helpers ----------
  function seededTeams(cat) {

  // ---------- graph editing ----------
  function addPhase(state, cat, type, name) {

  // ---------- ranking catalog (PHASE-DESIGN §5, §6) ----------

        { id: 'overall', label: 'Overall (per-game averages)', size: phase.entrants.length },
        ...Array.from({ length: maxSize }, (_, i) => ({ id: `cross:${i + 1}`, label: `Best ${ordinal(i + 1)}-placed`, size: phase.pools.filter((p) => p.ids.length > i).length })),

  function removePhaseGames(state, cat, phase) {

  // ---------- groups (round robin) ----------

  function poolPairs(ids, mode, k) {

  Object.assign(TE.DISTRIBUTIONS, { SNAKE: 'A serpentina (teste di serie)', SEQUENTIAL: 'In ordine di testa di serie', MANUAL: 'Manuale', AVOID_REMATCH: 'Evita le rivincite' });
  Object.assign(TE.STATUS_LABEL, { DRAFT: 'Da configurare', READY: 'In attesa', IN_PROGRESS: 'In corso', COMPLETE: 'Da confermare', CONFIRMED: 'Confermata' });
  const sp = { FOOTBALL: ['Calcio', ['campo', 'campi'], ['gol', 'gol']], FUTSAL: ['Calcio a 5', ['campo', 'campi'], ['gol', 'gol']], VOLLEYBALL: ['Pallavolo', ['campo', 'campi'], ['punto', 'punti']], TENNIS: ['Tennis', ['campo', 'campi'], ['game', 'game']], PADEL: ['Padel', ['campo', 'campi'], ['game', 'game']] };
  Object.entries(sp).forEach(([k, [label, space, unit]]) => Object.assign(TE.SPORTS[k], { label, space, unit }));
  const rules = {
    POINTS: ['Punti', 'PT'], WINS: ['Vittorie', 'V'], MATCHUPS: ['Esiti', '2×V + N'], SCORE_DIFF: ['Differenza punteggio', 'Fatti − subiti'], SCORE_FOR: ['Più fatti', 'Fatti'],
    SCORE_AGAINST_LEAST: ['Meno subiti', 'Subiti (minimo)'], SCORE_RATIO: ['Quoziente punteggio', 'Fatti ÷ subiti'], SET_DIFF: ['Differenza set', 'Set vinti − persi'], SET_RATIO: ['Quoziente set', 'Set vinti ÷ persi'],
    SETS_FOR: ['Più set vinti', 'Set vinti'], SETS_AGAINST_LEAST: ['Meno set persi', 'Set persi (minimo)'],
  };
  Object.entries(rules).forEach(([k, [name, eq]]) => Object.assign(TE.RULES[k], { name, eq }));
  Object.assign(TE.COLUMNS, { GP: 'Giocate', W: 'Vinte', T: 'Pareggiate', L: 'Perse', C: 'Annullate', F: 'Forfait', PF: 'Fatti', PA: 'Subiti', PD: 'Differenza', SF: 'Set vinti', SA: 'Set persi', SD: 'Differenza set', PTS: 'Punti' });
  // short Italian column headers (keys stay the engine's)
  window.COL_SHORT = { GP: 'G', W: 'V', T: 'N', L: 'P', C: 'A', F: 'F', PF: 'GF', PA: 'GS', PD: 'DG', SF: 'SV', SA: 'SP', SD: 'DS', PTS: 'PT' };

  const roundOf = (n) => ({ 4: 'Semifinali', 8: 'Quarti', 16: 'Ottavi', 32: 'Sedicesimi', 64: 'Trentaduesimi', 128: 'Sessantaquattresimi' }[n] || `Turno a ${n}`);
  const O = '(\\d+)(?:st|nd|rd|th)';
  const re = (s, f) => new RegExp(s.replace(/#O/g, O), f || 'g');
  const MSG = [
    [re('^(.+) takes teams from (.+), which comes after it\\. Phases can only take from earlier phases\\.$'), '$1 prende squadre da $2, che viene dopo. Una fase può prendere solo da fasi precedenti.'],
    [re('^(.+) ranks (players|teams) but (.+) needs (players|teams)\\.$'), (m, a, k, b, k2) => `${a} classifica ${k === 'players' ? 'giocatori' : 'squadre'} ma ${b} richiede ${k2 === 'players' ? 'giocatori' : 'squadre'}.`],
    [re('^(.+) has no ranking “(.+)”\\.$'), '$1 non ha la classifica “$2”.'],
    [re('^A selector from (.+) has no positions\\.$'), 'Una selezione da $1 non ha posizioni.'],
    [re('^A selector points to a phase that no longer exists\\.$'), 'Una selezione punta a una fase che non esiste più.'],
    [re('^(.+): “(.+)” has only (\\d+) places; extra positions are ignored\\.$'), '$1: “$2” ha solo $3 posti; le posizioni in più sono ignorate.'],
    [re('^“(.+)” is used twice \\((.+) and (.+)\\)\\.$'), '“$1” è usato due volte ($2 e $3).'],
    [re('^Mixing “Overall” with group places of (.+) can select the same team twice\\.$'), 'Mescolare la classifica generale con i posti nei gironi di $1 può selezionare due volte la stessa squadra.'],
    [re('^“#O of a group” and “best #O-placed” from (.+) can select the same team twice\\.$'), '“$1° del girone” e “migliori $2°” di $3 possono selezionare due volte la stessa squadra.'],
    [re('^#O-placed teams of (.+) are taken both by group and as “best #O-placed” in different phases\\.$'), 'Le $1° classificate di $2 sono prese sia per girone sia come “migliori $3°” in fasi diverse.'],
    [re('^(.+) is split by “Overall” and by group places in different phases; the same team could be taken twice\\.$'), '$1 è divisa per classifica generale e per posti nei gironi in fasi diverse: la stessa squadra potrebbe essere presa due volte.'],
    [re('^(\\d+) of (\\d+) (players|teams) in (.+) do not continue to another phase\\.$'), (m, a, b, k, p) => `${a} ${k === 'players' ? 'giocatori' : 'squadre'} su ${b} di ${p} non proseguono in un’altra fase.`],
    [re('^Choose which side forfeits\\.$'), 'Scegli chi dà forfait.'],
    [re('^Enter both scores\\.$'), 'Inserisci entrambi i punteggi.'],
    [re('^Scores add up to (\\d+), not (\\d+)\\.$'), 'I punteggi sommano $1, non $2.'],
    [re('^Enter at least one set\\.$'), 'Inserisci almeno un set.'],
    [re('^A set cannot end level\\.$'), 'Un set non può finire in parità.'],
    [re('^Unusual set score (.+)\\.$'), 'Punteggio del set insolito: $1.'],
    [re('^Sets are level; this sport needs a winner\\.$'), 'Set in parità: serve un vincitore.'],
    [re('^Best of (\\d+): the winner usually takes (\\d+) sets\\.$'), 'Al meglio dei $1: di solito chi vince ne prende $2.'],
    [re('^Knockout games need a winner\\.$'), 'Le partite a eliminazione diretta richiedono un vincitore.'],
    [re('^This sport does not allow draws\\.$'), 'Questo sport non prevede il pareggio.'],
    [re('^This phase has not started: earlier phases must be confirmed first\\.$'), 'La fase non è iniziata: prima vanno confermate le fasi precedenti.'],
    [re('^Every game in this phase needs a result first\\. Cancel or forfeit games that will not be played\\.$'), 'Tutte le partite della fase devono avere un risultato. Annulla o assegna a forfait quelle che non si giocano.'],
    [re('^Order the tied teams first\\.$'), 'Prima ordina le squadre a pari merito.'],
    [re('^This game cannot be played yet\\.$'), 'Questa partita non si può ancora giocare.'],
  ];
  const TR = [
    [/Grand Final \(reset\)/g, 'Finalissima (bella)'], [/Grand Final/g, 'Finalissima'],
    [/Upper Final/g, 'Finale vincenti'], [/Upper Round (\d+)/g, 'Vincenti · turno $1'],
    [/Lower Final/g, 'Finale perdenti'], [/Lower Round (\d+)/g, 'Perdenti · turno $1'],
    [re('#O Place Semis'), '$1° posto · semifinali'], [re('#O Place Round of (\\d+)'), (m, a, b) => `${a}° posto · ${roundOf(+b).toLowerCase()}`], [re('#O Place'), '$1° posto'],
    [/Semi Finals/g, 'Semifinali'], [/Quarter Finals/g, 'Quarti'], [/Round of (\d+)/g, (m, n) => roundOf(+n)],
    [/Final placings/g, 'Piazzamenti finali'], [/Players by points won/g, 'Giocatori per punti'], [/Overall \(per-game averages\)/g, 'Generale (medie per partita)'], [/Each group/g, 'Ogni girone'],
    [/\bFinal\b/g, 'Finale'], [/Winner of (\d+)/g, 'Vincente #$1'], [/Loser of (\d+)/g, 'Perdente #$1'],
    [/\bConsolation\b/g, 'Consolazione'], [/\bTBD\b/g, 'Da definire'], [/\bRound (\d+)\b/g, 'Turno $1'], [/ · place (\d+)/g, ' · posto $1'],
    [re('Tied for #O'), 'Pari merito al $1° posto'], [re('Best #O-placed'), 'Migliori $1°'], [re('#O best #O'), '$1° tra le $2°'],
    [/\bGroup ([A-Z])\b/g, 'Girone $1'], [re('#O\\b'), '$1°'],
  ];
  function T(s) {
    if (s == null) return '';
    let out = String(s);
    for (const [r, v] of MSG) { r.lastIndex = 0; if (r.test(out)) { r.lastIndex = 0; out = out.replace(r, v); break; } }
    for (const [r, v] of TR) out = out.replace(r, v);
    return out;
  }
  window.T = T;
  window.ordIt = (n) => `${n}°`;
})();

</script>
<script>
/* Turno — mockup navigabile della sezione Fasi.
   Logica: engine.js (window.TE) invariato, dalla repo tournament_creation_mockup.
   UI: grafica Turno (sidebar, mappa torneo a chip, finestra "Tabellone fase"), testi in italiano via i18n.js (window.T). */
(function () {
  'use strict';
  const { useState, useEffect } = React;
  const html = htm.bind(React.createElement);
  const STORE = 'turno-fasi-mockup-v1';
  const T = window.T;

  // ---------- persistenza (solo comodità locale) ----------
  function load() {
    try { const s = localStorage.getItem(STORE); if (s) { const p = JSON.parse(s); if (p && p.version === 2) return TE.migrateState(p); } } catch (e) { /* storage non disponibile */ }
    return demoState();
  }
  function save(s) { try { localStorage.setItem(STORE, JSON.stringify(s)); } catch (e) { /* ignora */ } }
  const getPref = (k, d) => { try { return localStorage.getItem(STORE + ':' + k) || d; } catch (e) { return d; } };
  const setPref = (k, v) => { try { localStorage.setItem(STORE + ':' + k, v); } catch (e) { /* ignora */ } };

  // ---------- torneo di esempio: padel, 9 coppie, Gironi → Oro (BYE alle migliori prime) + Argento ----------
  function demoState() {
    const st = TE.emptyState();
    st.tournament.name = 'Torneo d’autunno';
    TE.setSport(st, 'PADEL');
    const c = TE.newCategory('Open maschile', 'PADEL');
    st.categories.push(c);
    [['Rossi', 'Bianchi'], ['Ferrari', 'Esposito'], ['Romano', 'Colombo'], ['Ricci', 'Marino'], ['Greco', 'Bruno'], ['Gallo', 'Conti'], ['De Luca', 'Mancini'], ['Costa', 'Giordano'], ['Rizzo', 'Lombardi']]
      .forEach(([a, b], i) => c.teams.push({ id: TE.uid('team'), name: `${a} / ${b}`, seed: i + 1, players: [{ id: TE.uid('pl'), name: a }, { id: TE.uid('pl'), name: b }] }));
    const g = TE.addPhase(st, c, 'GROUPS', 'Gironi');
    g.config.pools = 3;
    const oro = TE.addPhase(st, c, 'KNOCKOUT', 'Oro');
    oro.config.placements = [1, 3];
    const arg = TE.addPhase(st, c, 'KNOCKOUT', 'Argento');
    TE.rebuildPhase(st, c, g, true);
    c.connectors.push({ id: TE.uid('con'), to: oro.id, seeding: 'SELECTOR_ORDER', transform: null, selectors: [{ fromPhase: g.id, ranking: 'cross:1', positions: [1, 2, 3] }, { fromPhase: g.id, ranking: 'cross:2', positions: [1, 2, 3] }] });
    c.connectors.push({ id: TE.uid('con'), to: arg.id, seeding: 'SELECTOR_ORDER', transform: null, selectors: [{ fromPhase: g.id, ranking: 'cross:3', positions: [1, 2, 3] }] });
    TE.rebuildAll(st, c);
    st.venues.push({ id: TE.uid('ven'), name: 'Circolo Padel Città', spaces: [1, 2, 3, 4].map((i) => ({ id: TE.uid('sp'), name: `Campo ${i}`, categoryIds: [] })) });
    TE.allSpaces(st).forEach((s) => { st.schedule.courts[s.id] = null; });
    try { TE.buildQueue(st); } catch (e) { /* coda opzionale */ }
    return st;
  }

  // ---------- piccoli componenti ----------
  const Tag = ({ tone, children }) => html`<span className=${'tag ' + (tone || '')}><span>${children}</span></span>`;
  const Btn = ({ kind, onClick, disabled, children, title, id }) => html`<button type="button" id=${id} className=${'btn ' + (kind || '')} onClick=${onClick} disabled=${disabled} title=${title}>${children}</button>`;
  const Note = ({ tone, children }) => html`<div className=${'note ' + (tone || '')}>${children}</div>`;
  const Field = ({ label, hint, id, children }) => html`<label className="field" htmlFor=${id}><span className="field-label">${label}</span>${children}${hint ? html`<span className="hint">${hint}</span>` : null}</label>`;
  const Card = ({ eb, title, sub, actions, children, id }) => html`<section className="card cut" id=${id}>
    ${title || eb ? html`<header className="card-h"><div>${eb ? html`<div className="eb">${eb}</div>` : null}${title ? html`<h2>${title}</h2>` : null}${sub ? html`<p>${sub}</p>` : null}</div>${actions ? html`<div className="row">${actions}</div>` : null}</header>` : null}
    ${children}</section>`;
  const statusTone = { DRAFT: 'warn', READY: '', IN_PROGRESS: 'blue', COMPLETE: 'warn', CONFIRMED: 'green' };
  const StatusTag = ({ st, cat, phase }) => { const s = TE.phaseStatus(st, cat, phase); return html`<${Tag} tone=${statusTone[s]}>${TE.STATUS_LABEL[s]}<//>`; };
  const typeLabel = (t) => TE.PHASE_TYPES[t].label;
  const kindWord = (phase) => (TE.PHASE_TYPES[phase.type].kind === 'PLAYER' ? 'giocatori' : 'squadre');

  function Modal({ title, children, onClose, footer }) {
    useEffect(() => { const k = (e) => e.key === 'Escape' && onClose(); window.addEventListener('keydown', k); return () => window.removeEventListener('keydown', k); }, []);
    return html`<div className="modal-back" onMouseDown=${(e) => e.target === e.currentTarget && onClose()}>
      <div className="modal cut" role="dialog" aria-modal="true" aria-label=${title}>
        <header className="modal-h"><h3>${title}</h3><button className="icon-btn" aria-label="Chiudi" onClick=${onClose}>×</button></header>
        <div className="modal-b">${children}</div>
        ${footer ? html`<footer className="modal-f">${footer}</footer>` : null}
      </div></div>`;
  }

  // ---------- app ----------
  function App() {
    const [st, setSt] = useState(load);
    const [view, setView0] = useState(() => getPref('view', 'fasi'));
    const [catId, setCatId] = useState(() => (st.categories[0] ? st.categories[0].id : null));
    const [sel, setSel] = useState(null);
    const [modal, setModal] = useState(null);
    const [toast, setToast] = useState(null);
    const setView = (v) => { setView0(v); setPref('view', v); window.scrollTo(0, 0); };

    const cat = TE.findCat(st, catId) || st.categories[0] || null;
    const sport = st.tournament.sport ? TE.SPORTS[st.tournament.sport] : null;
    function act(fn) { const d = TE.clone(st); const out = fn(d, cat ? TE.findCat(d, cat.id) : null); save(d); setSt(d); return out; }
    function say(msg, tone) { setToast({ msg: T(msg), tone }); clearTimeout(say.t); say.t = setTimeout(() => setToast(null), 3800); }
    function ask(title, body, confirmText, fn, danger) {
      setModal(html`<${Modal} title=${title} onClose=${() => setModal(null)} footer=${html`<${Btn} kind="ghost" onClick=${() => setModal(null)}>Annulla<//><${Btn} kind=${danger ? 'primary danger' : 'primary'} onClick=${() => { setModal(null); fn(); }}>${confirmText}<//>`}><p style=${{ margin: 0 }}>${body}</p><//>`);
    }
    const ctx = { st, cat, sport, act, say, ask, setModal, setView, setCatId, sel, setSel, setSt };
    const pub = st.tournament.status === 'PUBLISHED';
    const nTeams = cat ? cat.teams.filter((t) => !t.fromAmericano).length : 0;
    const nav = [
      { id: 'info', label: 'Informazioni' },
      { id: 'categorie', label: 'Categorie', cnt: st.categories.length },
      { id: 'partecipanti', label: 'Partecipanti', cnt: nTeams, perCat: true },
      { id: 'campi', label: 'Campi di gioco', cnt: TE.allSpaces(st).length },
      { id: 'fasi', label: 'Fasi', cnt: cat ? cat.phases.length : 0, perCat: true },
      { id: 'programma', label: 'Programma', run: true },
      { id: 'risultati', label: 'Risultati', run: true, perCat: true, cnt: cat ? `${cat.games.filter((g) => g.result).length}/${cat.games.length}` : '' },
      { id: 'classifiche', label: 'Classifiche', run: true, perCat: true },
    ].map((n) => Object.assign(n, { locked: !sport && n.id !== 'info' }));
    const cur = nav.find((n) => n.id === view && !n.locked) || nav[0];
    const views = { info: InfoView, categorie: CategoriesView, partecipanti: TeamsView, campi: VenuesView, fasi: FasiView, programma: ScheduleView, risultati: GamesView, classifiche: StandingsView };
    const View = views[cur.id];

    return html`<div className="app">
      <aside className="side">
        <div className="logo">Turno<small>GESTIONE TORNEI</small></div>
        <div className="side-active">◆ TORNEO ${pub ? 'ATTIVO' : 'IN BOZZA'}</div>
        <div className="side-t">${st.tournament.name || 'Torneo senza nome'}</div>
        <nav className="nav" aria-label="Sezioni del torneo">
          ${nav.map((n) => html`<${React.Fragment} key=${n.id}>${n.id === 'programma' ? html`<div className="nav-sep">GIORNO DI GARA</div>` : null}
            <button className=${cur.id === n.id ? 'on' : ''} disabled=${n.locked} onClick=${() => setView(n.id)}>${n.label}${n.cnt !== undefined && n.cnt !== '' ? html`<span className="cnt">${n.cnt}</span>` : null}</button><//>`)}
        </nav>
        <div className="side-foot">Mockup navigabile. Logica: engine.js della repo tournament_creation_mockup. I dati restano in questo browser.
          <button onClick=${() => ask('Ripristinare il torneo di esempio?', 'Tutto quello che hai cambiato in questo browser viene sostituito dal torneo di padel di esempio.', 'Ripristina', () => { const d = demoState(); save(d); setSt(d); setCatId(d.categories[0].id); setSel(null); say('Torneo di esempio ripristinato.', 'good'); })}>Ripristina esempio</button></div>
      </aside>
      <div style=${{ minWidth: 0 }}>
        <header className="top">
          <${Tag} tone=${pub ? 'green' : ''}>${pub ? 'Attivo' : 'Bozza'}<//>
          <span className="t-name">${st.tournament.name || 'Torneo senza nome'}</span>
          ${sport ? html`<span className="sport-pill">Sport <b>${sport.label}</b></span>` : null}
          <span className="grow"></span>
          <button className=${'btn bev ' + (pub ? '' : 'primary')} onClick=${() => { act((d) => { d.tournament.status = pub ? 'DRAFT' : 'PUBLISHED'; }); say(pub ? 'Torneo riportato in bozza.' : 'Torneo attivo: ora puoi inserire i risultati.', 'good'); }}>${pub ? 'Riporta in bozza' : 'Attiva torneo →'}</button>
        </header>
        <main className="main">
          ${cur.perCat && st.categories.length > 1 ? html`<div className="cat-chips" role="tablist" aria-label="Categoria">${st.categories.map((c) => html`<button key=${c.id} role="tab" aria-selected=${c.id === cat.id} className=${c.id === cat.id ? 'on' : ''} onClick=${() => { setCatId(c.id); setSel(null); }}>${c.name}</button>`)}</div>` : null}
          ${cur.perCat && !cat ? html`<div className="empty-hero cut"><div className="eb">Nessuna categoria</div><p style=${{ margin: 0 }}>Squadre, fasi e classifiche appartengono a una categoria. Creane una per iniziare.</p><${Btn} kind="primary" onClick=${() => setView('categorie')}>Vai a Categorie<//></div>`
            : html`<${View} key=${cur.perCat ? cat.id + cur.id : cur.id} ...${ctx} />`}
        </main>
      </div>
      ${modal}
      ${toast ? html`<div className=${'toast ' + (toast.tone || '')} role="status">${toast.msg}</div>` : null}
    </div>`;
  }
  const resultsIn = (cat) => cat.games.filter((g) => g.result).length;
  const PageHead = ({ title, lead }) => html`<header><h1 className="h1">${title}</h1>${lead ? html`<p className="lead">${lead}</p>` : html`<div style=${{ height: 16 }}></div>`}</header>`;

  // ---------- Informazioni ----------
  function InfoView({ st, act, ask, say, setCatId, setSt, setSel }) {
    const t = st.tournament;
    const locked = st.categories.some((c) => c.teams.length || c.players.length || c.phases.length);
    return html`<div>
      <${PageHead} title="Informazioni" lead="Dati generali validi per tutte le categorie." />
      <div className="stack">
        <${Card} eb="Torneo">
          <div className="grid2">
            <${Field} label="Nome" id="ev-name"><input id="ev-name" placeholder="Nome del torneo" value=${t.name} onChange=${(e) => act((d) => { d.tournament.name = e.target.value; })} /><//>
            <${Field} label="Sport" id="ev-sport" hint=${locked ? 'Per cambiare sport togli prima squadre e fasi.' : null}><select id="ev-sport" value=${t.sport || ''} disabled=${locked} onChange=${(e) => act((d) => TE.setSport(d, e.target.value))}>
              <option value="" disabled>Scegli lo sport</option>${Object.entries(TE.SPORTS).map(([k, v]) => html`<option value=${k}>${v.label}</option>`)}</select><//>
            ${t.sport ? html`<${Field} label="Riposo minimo tra due partite (minuti)" id="ev-rest" hint=${`Predefinito per ${TE.SPORTS[t.sport].label}: ${TE.SPORTS[t.sport].rest} min. 0 lo disattiva.`}><input id="ev-rest" type="number" min="0" step="5" value=${t.restMinutes} onChange=${(e) => act((d) => { d.tournament.restMinutes = Math.max(0, +e.target.value || 0); })} /><//>` : null}
          </div>
        <//>
        ${t.sport ? html`<${SportCard} sport=${t.sport} />` : null}
        <${Card} eb="Dati del mockup" sub="Il mockup parte da un torneo di padel di esempio: 9 coppie, tre gironi, tabellone Oro con BYE alle migliori prime e tabellone Argento.">
          <div className="row">
            <${Btn} onClick=${() => ask('Ripristinare il torneo di esempio?', 'Le modifiche fatte in questo browser vengono sostituite.', 'Ripristina', () => { const d = demoState(); save(d); setSt(d); setCatId(d.categories[0].id); setSel(null); say('Torneo di esempio ripristinato.', 'good'); })}>Ripristina esempio<//>
            <${Btn} kind="danger" onClick=${() => ask('Svuotare tutto?', 'Nome, sport, categorie, squadre, fasi, campi e risultati vengono rimossi.', 'Svuota', () => { act((d) => { Object.keys(d).forEach((k) => delete d[k]); Object.assign(d, TE.emptyState()); }); setCatId(null); setSel(null); say('Torneo svuotato.'); }, true)}>Parti da zero<//>
          </div>
        <//>
      </div></div>`;
  }
  function SportCard({ sport }) {

  // ---------- logica di selezione (dal mockup, invariata) ----------
  const RANKING_KINDS = {
    POOL: { label: 'Classifica del girone', help: 'Posizioni dentro ogni girone. “1°–2°” = le prime due di ogni girone.' },
    CROSS: { label: 'Classifica tra gironi', help: 'Squadre con lo stesso piazzamento in gironi diversi, confrontate sulle medie per partita. “1° tra le 2°” = la migliore seconda.' },
    OVERALL: { label: 'Classifica generale', help: 'Tutte le squadre della fase in un’unica tabella, sulle medie per partita.' },
    FINAL: { label: 'Piazzamenti finali', help: '1°, 2°, poi per turno di eliminazione e criteri di spareggio.' },
    PLAYERS: { label: 'Classifica giocatori', help: 'Giocatori per punti conquistati.' },
  };
  const kindsFor = (src) => (src.type === 'GROUPS' ? ['POOL', 'CROSS', 'OVERALL'] : src.type === 'KNOCKOUT' ? ['FINAL'] : ['PLAYERS']);
  const kindOfRanking = (rid, src) => (rid.startsWith('pool:') ? 'POOL' : rid.startsWith('cross:') ? 'CROSS' : rid === 'final' ? 'FINAL' : src.type === 'AMERICANO' ? 'PLAYERS' : 'OVERALL');
  function describeSelector(cat, s) {
    const p = TE.findPhase(cat, s.fromPhase); const pos = s.positions.map((x) => x + '°').join(', ');
    if (!p) return ['?', ''];
    if (s.ranking === 'pool:*') return ['Classifica del girone', `${pos} di ogni girone`];
    if (s.ranking.startsWith('pool:')) { const g = p.pools.find((q) => `pool:${q.number}` === s.ranking); return ['Classifica del girone', `${pos} del ${g ? T(g.name) : 'girone'}`]; }
    if (s.ranking.startsWith('cross:')) return ['Classifica tra gironi', `${pos} tra le ${s.ranking.slice(6)}° classificate`];
    if (s.ranking === 'final') return ['Piazzamenti finali', pos];
    return [p.type === 'AMERICANO' ? 'Classifica giocatori' : 'Classifica generale', pos];
  }
  function rankingItems(cat, src, kind) {
    const name = (rid, pos) => { const id = src.snapshot && src.snapshot[rid] && src.snapshot[rid][pos - 1]; return id ? TE.participantName(cat, src, id) : null; };
    const item = (rid, pos, label, group) => ({ key: `${rid}|${pos}`, ranking: rid, pos, label, group, who: name(rid, pos) });
    if (kind === 'POOL') return src.pools.flatMap((p) => p.ids.map((_, i) => item(`pool:${p.number}`, i + 1, `${i + 1}° ${T(p.name)}`, T(p.name))));
    if (kind === 'CROSS') {
      const max = Math.max(0, ...src.pools.map((p) => p.ids.length)), out = [];
      for (let k = 1; k <= max; k++) { const n = src.pools.filter((p) => p.ids.length >= k).length; for (let j = 1; j <= n; j++) out.push(item(`cross:${k}`, j, `${j}° tra le ${k}°`, `${k}° classificate`)); }
      return out;
    }
    const rid = kind === 'FINAL' ? 'final' : 'overall';
    return src.entrants.map((_, i) => item(rid, i + 1, i === src.entrants.length - 1 && i > 0 ? `${i + 1}° (ultima)` : `${i + 1}°`, null));
  }
  function selectorKeys(src, sels) {
    const keys = new Set();
    sels.filter((s) => s.fromPhase === src.id).forEach((s) => {
      const rids = s.ranking === 'pool:*' ? src.pools.map((p) => `pool:${p.number}`) : [s.ranking];
      rids.forEach((rid) => s.positions.forEach((pos) => keys.add(`${rid}|${pos}`)));
    });
    return keys;
  }
  function keysToSelectors(src, keys) {
    const by = {};
    [...keys].forEach((k) => { const [rid, pos] = k.split('|'); (by[rid] = by[rid] || []).push(+pos); });
    Object.values(by).forEach((a) => a.sort((x, y) => x - y));
    const out = [];
    const pools = src.pools.map((p) => `pool:${p.number}`);
    const poolSel = pools.filter((r) => by[r]);
    if (poolSel.length) {
      const union = [...new Set(poolSel.flatMap((r) => by[r]))].sort((a, b) => a - b);
      const every = src.pools.every((p) => { const want = union.filter((x) => x <= p.ids.length); const got = by[`pool:${p.number}`] || []; return want.length === got.length && want.every((x, i) => x === got[i]); });
      if (every) out.push({ fromPhase: src.id, ranking: 'pool:*', positions: union });
      else poolSel.forEach((r) => out.push({ fromPhase: src.id, ranking: r, positions: by[r] }));
    }
    Object.keys(by).filter((r) => r.startsWith('cross:')).sort((a, b) => +a.slice(6) - +b.slice(6)).forEach((r) => out.push({ fromPhase: src.id, ranking: r, positions: by[r] }));
    ['overall', 'final'].forEach((r) => { if (by[r]) out.push({ fromPhase: src.id, ranking: r, positions: by[r] }); });
    return out;
  }
  // posti di "src" già presi da altre fasi: chiave → nome della fase
  function takenKeys(cat, src, exceptPhaseId) {
    const taken = {};
    cat.connectors.filter((c) => c.to !== exceptPhaseId).forEach((c) => selectorKeys(src, c.selectors).forEach((k) => { taken[k] = (TE.findPhase(cat, c.to) || {}).name; }));
    return taken;
  }
  // connettore per una nuova fase: prende i posti ancora liberi di src, nello stesso tipo di classifica già usato
  function freeConnector(cat, src, type, kindHint) {
    const used = cat.connectors.flatMap((c) => c.selectors).find((s) => s.fromPhase === src.id);
    const kind = kindHint || (used ? kindOfRanking(used.ranking, src) : src.type === 'GROUPS' ? (type === 'GROUPS' ? 'OVERALL' : 'POOL') : src.type === 'KNOCKOUT' ? 'FINAL' : 'PLAYERS');
    const taken = takenKeys(cat, src, null);
    const free = rankingItems(cat, src, kind).filter((x) => !taken[x.key]).map((x) => x.key);
    if (!free.length) return null;
    const seeding = kind === 'POOL' ? 'BY_SOURCE_POSITION' : 'SELECTOR_ORDER';
    return { id: TE.uid('con'), seeding, transform: null, selectors: keysToSelectors(src, new Set(free)) };
  }
  function useGuard({ cat, phase, ask }) {
    return (what, fn) => {
      const n = TE.phaseGames(cat, phase.id).filter((g) => g.result).length + TE.downstreamOf(cat, phase).reduce((s, d) => s + TE.phaseGames(cat, d.id).filter((g) => g.result).length, 0);
      return n ? ask(`${what}?`, `Vengono cancellati ${n} risultati di questa fase e delle fasi successive.`, 'Continua', fn, true) : fn();
    };
  }

  // ---------- Fasi: UX delle tavole W9 / W10 (mappa + tabellone fase), W5 / W6 (tabellone a menu, tra gironi), P2 (gironi drag & drop), W2 (nuova fase) ----------
  const ORD_F = ['', 'prima', 'seconda', 'terza', 'quarta', 'quinta', 'sesta', 'settima', 'ottava', 'nona', 'decima'];
  const ordF = (k) => ORD_F[k] || `${k}ª`;
  const BRANCH = ['Oro', 'Argento', 'Bronzo'];
  const BRANCH_COLOR = ['#D97706', '#9CA3AF', '#B7794A', '#2B63F1'];
  const ROUND = { 2: ['Finale', 'F', 'dalla finale'], 4: ['Semifinale', 'SF', 'dalle semifinali'], 8: ['Quarti', 'Q', 'dai quarti'], 16: ['Ottavi', 'O', 'dagli ottavi'], 32: ['Sedicesimi', 'S', 'dai sedicesimi'], 64: ['Trentaduesimi', 'T', 'dai trentaduesimi'] };
  const ROUND_BTNS = [32, 16, 8, 4, 2];
  const nextPow2 = (n) => { let p = 1; while (p < n) p *= 2; return p; };
  const kid = (k) => `${k.fromPhase}|${k.ranking}|${k.position}`;
  const LETTER = (n) => String.fromCharCode(64 + n);
  const firstGroups = (cat) => TE.sortedPhases(cat).find((p) => p.type === 'GROUPS');
  function poolName(cat, phase, pool) { const f = firstGroups(cat); return f && f.id === phase.id ? `Girone ${LETTER(pool.number)}` : `Girone ${phase.order}${LETTER(pool.number)}`; }
  const poolCode = (cat, phase, pool) => poolName(cat, phase, pool).replace('Girone ', '');
  function posLabel(cat, k) {
    const src = TE.findPhase(cat, k.fromPhase); if (!src) return '?';
    if (k.ranking.startsWith('pool:')) { const p = src.pools.find((q) => `pool:${q.number}` === k.ranking); return `${k.position}° ${p ? poolName(cat, src, p) : 'girone'}`; }
    if (k.ranking.startsWith('cross:')) return `${k.position}ª miglior ${ordF(+k.ranking.slice(6))}`;
    if (k.ranking === 'final') return `${k.position}° ${src.name}`;
    return `${k.position}° generale`;
  }
  const isCross = (k) => k && k.ranking && k.ranking.startsWith('cross:');
  const keysOf = (phase) => phase.entrants.filter((e) => e.source.fromPhase).map((e) => ({ fromPhase: e.source.fromPhase, ranking: e.source.ranking, position: e.source.position }));
  function entLabel(cat, phase, e) {
    if (e.participant) return TE.participantName(cat, phase, e.participant);
    if (e.source.fromPhase) return posLabel(cat, e.source);
    return T(TE.entrantLabel(cat, phase, e));
  }
  // testo di un lato partita: squadra reale se nota, altrimenti posizione / vincente / perdente
  function srcLabel(st, cat, src, codes) {
    const id = src.t !== 'pair' && src.t !== 'bye' ? TE.resolve(st, cat, src) : null;
    if (id) return { text: TE.teamName(cat, id), known: true };
    if (src.t === 'slot') { const p = TE.findPhase(cat, src.phase); const e = p && p.entrants.find((x) => x.id === src.id); return { text: e ? entLabel(cat, p, e) : 'Da definire', cross: e && isCross(e.source) }; }
    if (src.t === 'dep') return { text: `${src.res === 'W' ? 'Vincente' : 'Perdente'} ${(codes && codes[src.game]) || '#' + src.game}` };
    return { text: T(TE.sourceLabel(st, cat, src)) };
  }
  function writeKeys(d, c, phaseId, keys) { TE.setConnector(d, c, phaseId, { selectors: keys.map((k) => ({ fromPhase: k.fromPhase, ranking: k.ranking, positions: [k.position] })), seeding: 'SELECTOR_ORDER', transform: null }); }
  // chi usa già una posizione: id → nome della fase
  function ownerMap(cat, exceptId) {
    const m = {};
    cat.phases.filter((p) => p.id !== exceptId).forEach((p) => p.entrants.forEach((e) => { if (e.source.fromPhase) m[kid(e.source)] = p; }));
    return m;
  }
  const KIND_TITLE = { POOL: 'Per girone', CROSS: 'Tra gironi', OVERALL: 'Generale', FINAL: 'Piazzamenti finali', PLAYERS: 'Giocatori' };
  function optionGroups(cat, phase, onlySrc) {
    const srcs = TE.sortedPhases(cat).filter((p) => p.order < phase.order && p.built && (!onlySrc || p.id === onlySrc));
    return srcs.flatMap((src) => kindsFor(src).map((kind) => ({ src, kind, title: KIND_TITLE[kind] + (srcs.length > 1 ? ` · #${src.order} ${src.name}` : ''), items: rankingItems(cat, src, kind).map((x) => ({ k: { fromPhase: src.id, ranking: x.ranking, position: x.pos }, who: x.who })) })));
  }
  const siblingsOf = (cat, phase) => { if (TE.isRoot(cat, phase)) return [phase]; const key = (p) => TE.sourcesOf(cat, p).map((s) => s.id).sort().join(','); return TE.sortedPhases(cat).filter((p) => !TE.isRoot(cat, p) && key(p) === key(phase)); };
  function branchColor(cat, phase) { if (phase.type !== 'KNOCKOUT') return null; const s = siblingsOf(cat, phase).filter((p) => p.type === 'KNOCKOUT'); return s.length > 1 ? BRANCH_COLOR[Math.min(s.indexOf(phase), 3)] : null; }
  // posti finali decisi dalle fasi che chiudono un ramo
  // posti finali: le posizioni che non proseguono in nessuna fase. Prima le fasi più avanti nella mappa, a pari livello in ordine di fase
  function placeRanges(cat) {
    const out = {}; let start = 1;
    const { pos } = layout(cat);
    const used = {}; cat.phases.forEach((p) => p.entrants.forEach((e) => { if (e.source.fromPhase) used[e.source.fromPhase] = (used[e.source.fromPhase] || 0) + 1; }));
    TE.sortedPhases(cat).filter((p) => p.built).sort((a, b) => pos[b.id].d - pos[a.id].d || a.order - b.order).forEach((p) => {

  // ordine "di merito" di una posizione: prime di tutti i gironi, poi seconde… (tra gironi: tutte le 1ª, poi le 2ª…)

  // posizioni distribuite a serpentina nei gironi: 1ª riga A→C, 2ª riga C→A…
  function snakeFill(keys, P) { const pk = Array.from({ length: P }, () => []); keys.forEach((k, i) => { const r = Math.floor(i / P), c = i % P; pk[r % 2 ? P - 1 - c : c].push(k); }); return pk; }
  const snakePlaces = (sizes) => { const out = []; const R = Math.max(0, ...sizes); for (let r = 0; r < R; r++) { const row = []; sizes.forEach((z, p) => { if (r < z) row.push([p, r]); }); out.push(...(r % 2 ? row.reverse() : row)); } return out; };
  function manualCfg(phaseId, pk, sizes) { let o = 0; return { distribution: 'MANUAL', pools: pk.length, manualPools: pk.map((list, pi) => ({ number: pi + 1, name: `Group ${LETTER(pi + 1)}`, ids: list.map(() => `e_${phaseId}_${++o}`) })), poolSizes: sizes || pk.map((l) => l.length) }; }
  // primo turno del tabellone: config.layout (estensione dell'engine) oppure ordine standard delle teste di serie
  function koSlots(phase) {
    const n = phase.entrants.length;
    if (TE.validLayout(phase.config.layout, n)) return phase.config.layout.slice();
    return TE.seedOrder(nextPow2(Math.max(2, n))).map((s) => (s <= n ? s - 1 : null));
  }
  const byeByePair = (slots) => { for (let i = 0; i < slots.length; i += 2) if (slots[i] == null && slots[i + 1] == null) return true; return false; };
  // codici partita in stile tavole: Q1, SF2, F … (tabelloni a eliminazione singola)
  function koLayout(cat, phase) {
    const n = phase.entrants.length, slots = koSlots(phase), size = slots.length;
    const games = TE.phaseGames(cat, phase.id);
    const main = games.filter((g) => g.bracket === 'M');
    const depths = [...new Set(main.map((g) => g.depth))].sort((a, b) => a - b);
    const codes = {}; const cols = [];
    const r0 = main.filter((g) => g.depth === 0); let gi = 0;
    const pairs = [];
    for (let i = 0; i < size / 2; i++) {
      const a = slots[2 * i], b = slots[2 * i + 1];
      const bye = a == null || b == null;
      const code = `${ROUND[size] ? ROUND[size][1] : 'T'}${size === 2 ? '' : i + 1}`;
      const g = bye ? null : r0[gi++];
      if (g) codes[g.number] = code;
      pairs.push({ slots: [2 * i, 2 * i + 1], code, bye, g });
    }
    depths.filter((d) => d > 0).forEach((d) => {
      const sz = size >> d; const list = main.filter((g) => g.depth === d);
      list.forEach((g, j) => { codes[g.number] = `${ROUND[sz] ? ROUND[sz][1] : 'T'}${sz === 2 ? '' : j + 1}`; });
      cols.push({ title: ROUND[sz] ? ROUND[sz][0] : `Turno ${d + 1}`, games: list, final: sz === 2 });

    const cons = games.filter((g) => g.bracket === 'C');
    cons.forEach((g, j) => { codes[g.number] = `C${j + 1}`; });
    const slotCode = (si) => pairs[Math.floor(si / 2)].code;
    const slotHasBye = (si) => pairs[Math.floor(si / 2)].bye;
    const entrantCode = (idx) => { const si = slots.indexOf(idx); return si < 0 ? '?' : slotCode(si) + (slotHasBye(si) ? ' · BYE' : ''); };

  function phaseStateLabel(st, cat, p, on, err) {

  function chipSummary(cat, p, ranges) {

    const size = nextPow2(Math.max(2, n)); const byes = size - n;

  // il "chi passa" vive nella fase successiva: questa hook prova un nuovo elenco ordinato di posizioni e lo salva se il motore lo accetta
  function useKeys(ctx, phase) {
    const { st, cat, setSt, say, ask } = ctx;
    const guard = useGuard({ cat, phase, ask });
    const before = new Set(TE.validateGraph(st, cat).errors.map((e) => e.msg));
    const build = (keys, cfg) => { const d = TE.clone(st); const c = TE.findCat(d, cat.id); const p = TE.findPhase(c, phase.id); if (cfg) Object.assign(p.config, cfg); writeKeys(d, c, phase.id, keys); return { d, c }; };
    const check = (keys, cfg) => { const { d, c } = build(keys, cfg); const e = TE.validateGraph(d, c).errors.find((x) => !before.has(x.msg)); return e ? T(e.msg) : null; };
    const commit = (keys, cfg, msg) => {
      if (!keys.length) return say('Serve almeno una posizione: questa fase prende squadre da una fase precedente.', 'bad');
      const err = check(keys, cfg); if (err) return say(err, 'bad');
      guard('Cambiare le posizioni di questa fase', () => { const { d } = build(keys, cfg); save(d); setSt(d); if (msg) say(msg, 'good'); });

  }

  function FasiView(ctx) {
